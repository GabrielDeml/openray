name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # docs/DESIGN.md §3.1. Cocoa is covered because it re-exports AppKit. An import may follow
      # attributes, an access level ("internal import") or another statement and a semicolon.
      - name: Check core imports
        run: |
          pattern='(^|;)[[:space:]]*(@[[:alnum:]_]+(\([^)]*\))?[[:space:]]+)*((public|package|internal|fileprivate|private)[[:space:]]+)?import[[:space:]]+([[:alpha:]]+[[:space:]]+)?(AppKit|SwiftUI|Carbon|Cocoa)([^[:alnum:]_]|$)'
          if grep -rnE --include='*.swift' "$pattern" Packages/OpenRayCore/Sources; then
            echo "::error::OpenRayCore must not import AppKit, SwiftUI or Carbon"
            exit 1
          fi

      # docs/DESIGN.md §5.2. `swift test` resolves the package and `xcodebuild` the project, each
      # into a Package.resolved of its own. This runs before either of them, so it compares the
      # two files as they were committed. Both builds below are told to keep to their file: a
      # pin that the manifest no longer allows then fails the build and is not quietly replaced.
      - name: Check resolved GRDB versions agree
        run: |
          pin='.pins[] | select(.identity == "grdb.swift") | "\(.state.version) \(.state.revision)"'
          package=$(jq -r "$pin" Packages/OpenRayCore/Package.resolved)
          project=$(jq -r "$pin" OpenRay.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
          if [ -z "$package" ] || [ -z "$project" ]; then
            echo "::error::A Package.resolved file has no pin for GRDB"
            exit 1
          fi
          if [ "$package" != "$project" ]; then
            echo "::error::GRDB is resolved to '$package' by the package and to '$project' by the project"
            exit 1
          fi

      - name: Test core package
        run: swift test --force-resolved-versions --package-path Packages/OpenRayCore

      - name: Build app
        run: >
          xcodebuild
          -project OpenRay.xcodeproj
          -scheme OpenRay
          -configuration Debug
          -destination 'platform=macOS'
          -disableAutomaticPackageResolution
          build
          CODE_SIGNING_ALLOWED=NO
